name: Blender · prova técnica
on:
  push:
    branches: [main]
    paths:
      - blender/scripts/**
      - data/**
      - .github/workflows/prova-tecnica.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Blender livre
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y blender
          blender --version
      - name: Gerar fontes, GLB e uma imagem
        run: blender --background --threads 2 --python blender/scripts/gerar_cenario.py
      - name: Verificar exportação
        run: python3 scripts/check_assets.py
      - name: Guardar arquivos por 30 dias
        uses: actions/upload-artifact@v4
        with:
          name: fazenda-fase0-blender-glb-imagem
          retention-days: 30
          if-no-files-found: error
          path: |
            blender/base/fazenda_base.blend
            blender/assets/vegetacao/arvore-nativa-v1.blend
            public/models/*.glb
            public/renders/fase0.png
            public/data/build-info.json
            data/fazenda.scene.json
      - name: Registrar resultado
        run: |
          echo '## Prova técnica da Fazenda' >> "$GITHUB_STEP_SUMMARY"
          echo 'Terreno + uma árvore gerados no Blender. Fontes .blend, modelos GLB e PNG disponíveis no Artifact por 30 dias.' >> "$GITHUB_STEP_SUMMARY"
          cat public/data/build-info.json >> "$GITHUB_STEP_SUMMARY"
