name: Blender · prova técnica
on:
  push:
    branches: [main]
    paths:
      - blender/scripts/**
      - data/**
      - .github/workflows/prova-tecnica.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blender-fase0
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: ${{ runner.temp }}/blender-4.3.2-linux-x64
          key: blender-4.3.2-linux-x64-official-4da1c956
      - name: Baixar Blender oficial e verificar SHA-256
        if: steps.blender-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 --output blender-4.3.2-linux-x64.tar.xz https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz
          echo '4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  blender-4.3.2-linux-x64.tar.xz' | sha256sum --check
          tar -xf blender-4.3.2-linux-x64.tar.xz
      - name: Selecionar Blender 4.3.2
        run: echo "$RUNNER_TEMP/blender-4.3.2-linux-x64" >> "$GITHUB_PATH"
      - name: Gerar fontes, GLB e uma imagem
        run: blender --background --threads 2 --python blender/scripts/gerar_cenario.py
      - name: Verificar exportação
        run: python3 scripts/check_assets.py
      - name: Guardar arquivos por 30 dias
        uses: actions/upload-artifact@v4
        with:
          name: fazenda-fase0-blender-glb-imagem
          retention-days: 30
          if-no-files-found: error
          path: |
            blender/base/fazenda_base.blend
            blender/assets/vegetacao/arvore-nativa-v1.blend
            public/models/*.glb
            public/renders/fase0.png
            public/data/build-info.json
            data/fazenda.scene.json
      - name: Registrar resultado
        run: |
          echo '## Prova técnica da Fazenda' >> "$GITHUB_STEP_SUMMARY"
          echo 'Terreno + uma árvore gerados no Blender. Fontes .blend, modelos GLB e PNG disponíveis no Artifact por 30 dias.' >> "$GITHUB_STEP_SUMMARY"
          cat public/data/build-info.json >> "$GITHUB_STEP_SUMMARY"
